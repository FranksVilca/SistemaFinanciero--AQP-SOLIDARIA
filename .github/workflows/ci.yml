name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint (complexity, function size, no-explicit-any)
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start DynamoDB Local
        run: docker run -d --name dynamodb-local -p 8000:8000 amazon/dynamodb-local -jar DynamoDBLocal.jar -inMemory -sharedDb
      - name: Integration tests against DynamoDB Local
        run: npm run test:integration
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000

  infra-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Template assertions for every stage
        run: npm run test:infra

  emulator:
    # Real IAM policies of the template, Cognito with mandatory MFA and the stack deployment, against Floci with IAM enforcement on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start Floci with IAM enforcement
        run: docker compose -f backend/test/floci/docker-compose.yml up -d
      - name: Emulator tests (T02/T11 API Gateway authorizer, T10 AccessDenied, T14 mandatory MFA, stack deployment)
        run: npm run test:floci
        env:
          FLOCI_ENDPOINT: http://localhost:4566

  emulator-e2e:
    # Full path with the Lambda functions running in Docker. It mounts the Docker socket into the emulator, which is
    # acceptable on an ephemeral runner. It does not gate the deployment until it has been seen passing on a runner:
    # how the Lambda containers reach the emulator differs from Docker Desktop (see FLOCI_LAMBDA_ENDPOINT).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start Floci with the Docker socket
        run: docker compose -f backend/test/floci/docker-compose.lambda.yml up -d
      - name: Full-stack tests (gateway, authorizer, Lambda with its IAM role, DynamoDB, audit)
        run: npm run test:floci:e2e
        env:
          FLOCI_ENDPOINT: http://localhost:4566
          FLOCI_LAMBDA_ENDPOINT: http://172.17.0.1:4566

  dependency-audit:
    # Integrity of what ships (NIST SP 800-207, tenet 5): a high or critical advisory in a production dependency fails the
    # pipeline. The development tooling is audited too but only reported: its open advisories (vitest, tinypool) need a
    # major vitest upgrade and never reach the Lambda functions or the SPA bundle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Production dependencies (gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Development tooling (report only)
        run: npm audit --audit-level=high
        continue-on-error: true

  browser:
    # The SPA in a real browser against the whole system in Floci: sign-in, donation, sign-out, roles, CSP and CORS, once
    # over the production build and once over the Vite dev server. Same Docker-socket emulator as emulator-e2e, so it
    # does not gate the deployment until it has been seen passing on a runner. Chrome comes with the runner image.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Start Floci with the Docker socket
        run: docker compose -f backend/test/floci/docker-compose.lambda.yml up -d
      - name: Browser tests
        run: npm run test:browser
        env:
          BROWSER_CHANNEL: chrome
          FLOCI_ENDPOINT: http://localhost:4566
          FLOCI_LAMBDA_ENDPOINT: http://172.17.0.1:4566

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint aws-sam-translator checkov
      - name: cfn-lint
        run: cfn-lint
      - name: checkov (skips are justified in .checkov.yaml)
        run: checkov --config-file .checkov.yaml
      - name: CORS of the API as SAM translates it (a condition around a whole list made API Gateway ignore it)
        run: python infra/scripts/check_sam_cors.py infra/template.yaml

  deploy:
    # Only when every gate passed, on the main branch, and when the repository variables that identify the stack are set:
    # the deploy role (OIDC, no long-lived keys) and the Cognito domain prefix, which is unique in all of AWS and belongs
    # to one deployment. Without the prefix the template default would replace the domain of the existing stack.
    needs: [lint-format, typecheck, unit, integration, infra-tests, emulator, iac-scan, dependency-audit]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_CLOUDFORMATION_ROLE_ARN != '' && vars.COGNITO_DOMAIN_PREFIX != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=backend
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: sam build --template-file infra/template.yaml
      - run: >
          sam deploy
          --stack-name aqp-solidaria-academic
          --capabilities CAPABILITY_IAM
          --role-arn ${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}
          --resolve-s3
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides
          StageName=academic
          CognitoDomainPrefix=${{ vars.COGNITO_DOMAIN_PREFIX }}
          EnablePitr=false
          EnableCloudTrail=false
          EnableGuardDuty=false
          EnableSecurityHub=false
      # The site and the API are published together: the build takes the address of the API and the Cognito identifiers
      # from the outputs of the stack that was just deployed.
      - name: Publish the frontend (build, upload with cache headers, invalidate CloudFront)
        run: bash infra/scripts/publish-frontend.sh
        env:
          STACK_NAME: aqp-solidaria-academic
