name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      # DynamoDB Local for the integration tests (T08 concurrency, T06/T07 idempotency, T09 ownership).
      dynamodb-local:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run backend tests
        run: npm run test

      - name: Run integration tests (DynamoDB Local)
        run: npm run test:integration
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
