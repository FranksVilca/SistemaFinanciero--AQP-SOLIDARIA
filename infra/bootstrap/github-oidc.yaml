AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Identidad del CI de AQP-SOLIDARIA. Se despliega UNA vez por cuenta, a mano y por una persona administradora; no forma
  parte de la plantilla de la aplicacion (infra/template.yaml) porque es la identidad que despliega esa plantilla.
  Crea el proveedor OIDC de GitHub y dos roles: uno que GitHub asume (solo desde la rama indicada de este repositorio) y
  otro que solo CloudFormation puede usar para crear los recursos del stack.

# Por que dos roles
#   - El rol que asume GitHub solo puede manejar el stack por CloudFormation, subir sus artefactos y publicar el
#     frontend. No puede crear ni tocar ningun otro servicio de AWS directamente.
#   - Los permisos para crear los recursos (tablas, funciones, Cognito, CloudFront...) los tiene un segundo rol que
#     unicamente CloudFormation puede asumir, y solo para el stack de esta aplicacion. GitHub se lo pasa con
#     `sam deploy --role-arn` (iam:PassRole, condicionado al servicio CloudFormation).
#
# Lo que NO cubre, a proposito
#   GuardDuty y Security Hub (apagados por defecto en el plan gratuito): si se activan con sus parametros, el despliegue
#   falla con AccessDenied hasta que se agreguen sus permisos aqui. Fallar cerrado es mejor que dejarlos concedidos.
#
# Riesgo que queda y como se mitiga
#   Quien pueda subir a la rama `main` controla lo que CloudFormation crea dentro del espacio de nombres
#   `aqp-solidaria-<etapa>-*`, incluidos roles de funcion con cualquier permiso. Por eso la confianza esta limitada a esa
#   rama y se recomienda proteger `main` con revision obligatoria.

Parameters:
  # GitHub identifica la ejecucion con el nombre Y el numero de propietario y de repositorio
  # (repo:<propietario>@<id>/<repositorio>@<id>:ref:refs/heads/<rama>). Los numeros no cambian aunque se renombre o se
  # transfiera el repositorio, y un repositorio nuevo con el mismo nombre tendria otros: asi nadie hereda el acceso.
  # Se obtienen de https://api.github.com/repos/<propietario>/<repositorio> (campos `id` y `owner.id`). Si el
  # despliegue del CI falla con "Not authorized to perform sts:AssumeRoleWithWebIdentity", el evento
  # AssumeRoleWithWebIdentity del historial de CloudTrail muestra la identidad exacta que se presento.
  GitHubOwner:
    Type: String
    Default: FranksVilca
    AllowedPattern: '^[A-Za-z0-9_.-]+$'
    Description: Propietario del repositorio, con las mismas mayusculas que en GitHub.
  GitHubOwnerId:
    Type: String
    Default: "160974877"
    AllowedPattern: '^[0-9]+$'
    Description: Numero de la cuenta propietaria (owner.id de la API de GitHub).
  GitHubRepositoryName:
    Type: String
    Default: SistemaFinanciero--AQP-SOLIDARIA
    AllowedPattern: '^[A-Za-z0-9_.-]+$'
    Description: Nombre del repositorio, con las mismas mayusculas que en GitHub.
  GitHubRepositoryId:
    Type: String
    Default: "1448672488"
    AllowedPattern: '^[0-9]+$'
    Description: Numero del repositorio (id de la API de GitHub).
  GitHubBranch:
    Type: String
    Default: main
    AllowedPattern: '^[A-Za-z0-9._-]+$'
    Description: Unica rama desde la que se puede desplegar.
  StageName:
    Type: String
    Default: academic
    AllowedValues:
      - academic
    Description: Etapa que despliega el CI. La etapa production no se despliega desde el CI todavia.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Poner "false" si la cuenta ya tiene el proveedor token.actions.githubusercontent.com (solo puede haber uno).

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # --------------------------------------------------------------------------
  # Rol que asume GitHub
  # --------------------------------------------------------------------------
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aqp-solidaria-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepositoryName}@${GitHubRepositoryId}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: deploy-and-publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageTheStackWithChangeSets
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aqp-solidaria-${StageName}/*"
              - Sid: UseTheSamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Sid: ReadTheStackThatSamKeepsItsBucketIn
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplateSummary
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*"
              - Sid: UploadTheArtifactsOfTheDeployment
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*"
              - Sid: ListTheArtifactsBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*"
              - Sid: HandTheStackTheRoleThatCreatesItsResources
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    "iam:PassedToService": cloudformation.amazonaws.com
              - Sid: PublishTheFrontend
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::aqp-solidaria-spa-${StageName}-${AWS::AccountId}/*"
              - Sid: ListTheFrontendBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::aqp-solidaria-spa-${StageName}-${AWS::AccountId}"
              - Sid: InvalidateTheFrontendCache
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*"

  # --------------------------------------------------------------------------
  # Rol que solo CloudFormation puede usar: crea los recursos del stack
  # --------------------------------------------------------------------------
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aqp-solidaria-cloudformation-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
              ArnLike:
                "aws:SourceArn": !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aqp-solidaria-${StageName}/*"
      ManagedPolicyArns:
        - !Ref ComputeAndDataPolicy
        - !Ref EdgeAndIdentityPolicy
        - !Ref AlertsPolicy

  # Compute, data and access: functions, tables, API, their roles and their logs.
  ComputeAndDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: aqp-solidaria-deploy-compute-and-data
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # CloudFormation processes the SAM transform with this role (a service role), not with the caller's.
          - Sid: UseTheSamTransform
            Effect: Allow
            Action: cloudformation:CreateChangeSet
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
          - Sid: Tables
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:DescribeTable
              - dynamodb:UpdateTable
              - dynamodb:DescribeContinuousBackups
              - dynamodb:UpdateContinuousBackups
              - dynamodb:DescribeTimeToLive
              - dynamodb:UpdateTimeToLive
              - dynamodb:DescribeContributorInsights
              - dynamodb:DescribeKinesisStreamingDestination
              - dynamodb:ListTagsOfResource
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:GetResourcePolicy
              - dynamodb:PutResourcePolicy
              - dynamodb:DeleteResourcePolicy
            Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/aqp-*-${StageName}"
          - Sid: Functions
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:GetPolicy
              - lambda:ListTags
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:GetFunctionCodeSigningConfig
              - lambda:GetRuntimeManagementConfig
              - lambda:GetFunctionRecursionConfig
              - lambda:PutFunctionConcurrency
              - lambda:DeleteFunctionConcurrency
            Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:aqp-solidaria-${StageName}-*"
          - Sid: RolesOfTheFunctions
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:UpdateAssumeRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:PutRolePolicy
              - iam:GetRolePolicy
              - iam:DeleteRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aqp-solidaria-${StageName}-*"
          - Sid: OnlyTheBasicExecutionPolicyMayBeAttached
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aqp-solidaria-${StageName}-*"
            Condition:
              ArnEquals:
                "iam:PolicyARN": !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
          - Sid: RolesAreOnlyHandedToLambda
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aqp-solidaria-${StageName}-*"
            Condition:
              StringEquals:
                "iam:PassedToService": lambda.amazonaws.com
          # The daily schedule of the review expiry (a SAM Schedule event is an EventBridge rule named after the stack).
          - Sid: ScheduleRules
            Effect: Allow
            Action:
              - events:PutRule
              - events:DeleteRule
              - events:DescribeRule
              - events:EnableRule
              - events:DisableRule
              - events:PutTargets
              - events:RemoveTargets
              - events:ListTargetsByRule
              - events:TagResource
              - events:UntagResource
              - events:ListTagsForResource
            Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/aqp-solidaria-${StageName}-*"
          - Sid: ApiAndItsRoutes
            Effect: Allow
            Action:
              - apigateway:GET
              - apigateway:POST
              - apigateway:PUT
              - apigateway:PATCH
              - apigateway:DELETE
            Resource:
              - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis"
              - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*"
              - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*"
          - Sid: LogGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aqp-solidaria/${StageName}/*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aqp-solidaria/${StageName}/*:*"
          # These actions of CloudWatch Logs do not accept a resource: the access log of the API is wired through them.
          - Sid: LogDeliveryOfTheApiAccessLog
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:CreateLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:GetLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
            Resource: "*"

  # Edge, identity and storage: Cognito, CloudFront, the buckets, and the trail.
  EdgeAndIdentityPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: >-
              CloudFront and Cognito do not accept a resource in the actions that create or list their resources (the
              identifiers do not exist yet). Everything that does accept one is limited to this account, this region and
              the names of the application.
    Properties:
      ManagedPolicyName: aqp-solidaria-deploy-edge-and-identity
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: UserPools
            Effect: Allow
            Action:
              - cognito-idp:CreateGroup
              - cognito-idp:CreateResourceServer
              - cognito-idp:CreateUserPoolClient
              - cognito-idp:CreateUserPoolDomain
              - cognito-idp:DeleteGroup
              - cognito-idp:DeleteResourceServer
              - cognito-idp:DeleteUserPool
              - cognito-idp:DeleteUserPoolClient
              - cognito-idp:DeleteUserPoolDomain
              - cognito-idp:DescribeResourceServer
              - cognito-idp:DescribeUserPool
              - cognito-idp:DescribeUserPoolClient
              - cognito-idp:GetGroup
              - cognito-idp:GetUICustomization
              - cognito-idp:GetUserPoolMfaConfig
              - cognito-idp:ListGroups
              - cognito-idp:ListResourceServers
              - cognito-idp:ListTagsForResource
              - cognito-idp:ListUserPoolClients
              - cognito-idp:ListUserPoolClientSecrets
              - cognito-idp:SetUICustomization
              - cognito-idp:SetUserPoolMfaConfig
              - cognito-idp:TagResource
              - cognito-idp:UntagResource
              - cognito-idp:UpdateGroup
              - cognito-idp:UpdateResourceServer
              - cognito-idp:UpdateUserPool
              - cognito-idp:UpdateUserPoolClient
              - cognito-idp:UpdateUserPoolDomain
            Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
          # Creating and listing pools, and looking a domain up by name, do not accept a resource.
          - Sid: CreatingAndFindingUserPools
            Effect: Allow
            Action:
              - cognito-idp:CreateUserPool
              - cognito-idp:ListUserPools
              - cognito-idp:DescribeUserPoolDomain
            Resource: "*"
          # CloudFront actions that create or list do not accept a resource, and the identifiers are not known in advance.
          - Sid: Distribution
            Effect: Allow
            Action:
              - cloudfront:CreateDistribution
              - cloudfront:UpdateDistribution
              - cloudfront:DeleteDistribution
              - cloudfront:GetDistribution
              - cloudfront:GetDistributionConfig
              - cloudfront:ListDistributions
              - cloudfront:CreateOriginAccessControl
              - cloudfront:UpdateOriginAccessControl
              - cloudfront:DeleteOriginAccessControl
              - cloudfront:GetOriginAccessControl
              - cloudfront:ListOriginAccessControls
              - cloudfront:CreateResponseHeadersPolicy
              - cloudfront:UpdateResponseHeadersPolicy
              - cloudfront:DeleteResponseHeadersPolicy
              - cloudfront:GetResponseHeadersPolicy
              - cloudfront:ListResponseHeadersPolicies
              - cloudfront:TagResource
              - cloudfront:UntagResource
              - cloudfront:ListTagsForResource
            Resource: "*"
          - Sid: AppBuckets
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:ListBucket
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:GetBucketPublicAccessBlock
              - s3:PutBucketPublicAccessBlock
              - s3:GetEncryptionConfiguration
              - s3:PutEncryptionConfiguration
              - s3:GetBucketVersioning
              - s3:PutBucketVersioning
              - s3:GetLifecycleConfiguration
              - s3:PutLifecycleConfiguration
              - s3:GetBucketOwnershipControls
              - s3:PutBucketOwnershipControls
              - s3:GetBucketTagging
              - s3:PutBucketTagging
              - s3:GetBucketAcl
              - s3:GetBucketCORS
              - s3:GetBucketLogging
              - s3:GetBucketNotification
              - s3:GetBucketWebsite
              - s3:GetAccelerateConfiguration
              - s3:GetBucketObjectLockConfiguration
              - s3:GetReplicationConfiguration
              # CloudFormation reads the whole configuration of a bucket after it creates or changes it, not only the
              # parts the template sets, so every read of a bucket setting is allowed (they change nothing).
              - s3:GetAnalyticsConfiguration
              - s3:GetIntelligentTieringConfiguration
              - s3:GetInventoryConfiguration
              - s3:GetMetricsConfiguration
            Resource: !Sub "arn:${AWS::Partition}:s3:::aqp-solidaria-*-${StageName}-${AWS::AccountId}"
          - Sid: ReadTheCodeThatTheFunctionsAreCreatedFrom
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*"
          - Sid: Trail
            Effect: Allow
            Action:
              - cloudtrail:CreateTrail
              - cloudtrail:DeleteTrail
              - cloudtrail:UpdateTrail
              - cloudtrail:GetTrail
              - cloudtrail:GetTrailStatus
              - cloudtrail:StartLogging
              - cloudtrail:StopLogging
              - cloudtrail:AddTags
              - cloudtrail:RemoveTags
              - cloudtrail:ListTags
              - cloudtrail:PutEventSelectors
              - cloudtrail:GetEventSelectors
              - cloudtrail:GetInsightSelectors
              - cloudtrail:GetEventConfiguration
            Resource: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/aqp-solidaria-${StageName}"
          - Sid: FindingTrails
            Effect: Allow
            Action: cloudtrail:DescribeTrails
            Resource: "*"

  # Spend alert and alarms: the budget, the SNS topic that mails the warnings and the CloudWatch alarms. A policy of its
  # own because the one above is close to the size limit of a managed policy.
  AlertsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: >-
              DescribeAlarms does not accept a resource and only reads. Everything that changes something is limited to
              this account, this region and the names of the application.
    Properties:
      ManagedPolicyName: aqp-solidaria-deploy-alerts
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Budgets has no separate create action: ModifyBudget creates, changes and deletes the budget and its notifications.
          - Sid: SpendBudget
            Effect: Allow
            Action:
              - budgets:ViewBudget
              - budgets:ModifyBudget
            Resource: !Sub "arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/aqp-solidaria-${StageName}-*"
          - Sid: AlarmTopic
            Effect: Allow
            Action:
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:Subscribe
              - sns:Unsubscribe
              - sns:ListSubscriptionsByTopic
              - sns:GetSubscriptionAttributes
              - sns:SetSubscriptionAttributes
              - sns:ListTagsForResource
              - sns:TagResource
              - sns:UntagResource
            Resource: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:aqp-solidaria-${StageName}-*"
          - Sid: Alarms
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:ListTagsForResource
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
            Resource: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:aqp-solidaria-${StageName}-*"
          # Reading alarms does not accept a resource.
          - Sid: ReadingAlarms
            Effect: Allow
            Action: cloudwatch:DescribeAlarms
            Resource: "*"

Outputs:
  GitHubDeployRoleArn:
    Description: Valor de la variable de repositorio AWS_DEPLOY_ROLE_ARN en GitHub
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Description: Valor de la variable de repositorio AWS_CLOUDFORMATION_ROLE_ARN en GitHub
    Value: !GetAtt CloudFormationExecutionRole.Arn
