AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Plataforma de Donaciones Seguras Zero Trust - Fundación AQP-SOLIDARIA
  Serverless REST API y persistencia en AWS Free Plan.

Parameters:
  StageName:
    Type: String
    Default: academic
    AllowedValues:
      - academic
      - production
    Description: Stage de despliegue. Las funciones de simulación solo se despliegan en stage academic.
  CognitoDomainPrefix:
    Type: String
    Default: aqp-solidaria-auth
    Description: Prefijo para el dominio de Cognito Hosted UI.
  EnablePitr:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Recuperación a un punto en el tiempo de DynamoDB (no es gratuita, cuesta centavos con estos volúmenes).
      En el stage production siempre está activa.
  EnableCloudTrail:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Crea un trail de eventos de gestión (la primera copia es gratuita). Poner en false si la cuenta ya tiene uno.
  EnableGuardDuty:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Activa GuardDuty. Incluye 30 días de prueba gratuita por región; después se cobra. Apagar o aceptar el costo
      al terminar la prueba. Confirmar en Billing que el tipo de cuenta permite la prueba.
  EnableSecurityHub:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Activa Security Hub sin estándares por defecto. Verificar en la consola de la cuenta si aplica una prueba
      de 30 días antes de activarlo; después puede cobrarse.

Conditions:
  IsAcademicStage: !Equals [!Ref StageName, 'academic']
  IsProductionStage: !Equals [!Ref StageName, 'production']
  UsePitr: !Or
    - !Equals [!Ref EnablePitr, 'true']
    - !Condition IsProductionStage
  CloudTrailEnabled: !Equals [!Ref EnableCloudTrail, 'true']
  GuardDutyEnabled: !Equals [!Ref EnableGuardDuty, 'true']
  SecurityHubEnabled: !Equals [!Ref EnableSecurityHub, 'true']

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 256
    Tracing: Disabled
    LoggingConfig:
      LogFormat: JSON
      LogGroup: !Ref FunctionLogGroup
    Environment:
      Variables:
        STAGE: !Ref StageName
        PROJECTS_TABLE: !Ref ProjectsTable
        DONATIONS_TABLE: !Ref DonationsTable
        IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        AUDIT_TABLE: !Ref AuditTable
        COGNITO_USERINFO_URL: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/userInfo"
        NODE_OPTIONS: "--enable-source-maps"

Resources:
  # ============================================================================
  # PERSISTENCIA: DynamoDB (On-Demand, Free Plan)
  # Projects, Donations y Audit: protección contra borrado solo en production
  # (para que `sam delete` limpie el stage académico) y PITR bajo parámetro.
  # ============================================================================
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "aqp-projects-${StageName}"
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProductionStage, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [UsePitr, true, false]
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-createdAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DonationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "aqp-donations-${StageName}"
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProductionStage, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [UsePitr, true, false]
      AttributeDefinitions:
        - AttributeName: donationId
          AttributeType: S
        - AttributeName: donorSub
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: donationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: donorSub-createdAt-index
          KeySchema:
            - AttributeName: donorSub
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "aqp-idempotency-${StageName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Audit: una partición por día UTC (auditDay) para listar de más reciente a más antiguo con un Query por día.
  # Cambiar esta clave reemplaza la tabla al desplegar (aceptable mientras no haya datos reales).
  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "aqp-audit-${StageName}"
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: !If [IsProductionStage, true, false]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [UsePitr, true, false]
      AttributeDefinitions:
        - AttributeName: auditDay
          AttributeType: S
        - AttributeName: timestamp#eventId
          AttributeType: S
      KeySchema:
        - AttributeName: auditDay
          KeyType: HASH
        - AttributeName: timestamp#eventId
          KeyType: RANGE
      # Defensa en profundidad: aunque se ampliaran los permisos IAM, los roles de las funciones no pueden
      # editar ni borrar eventos. El ARN se construye con el nombre fijo para evitar una referencia circular.
      ResourcePolicy:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: DenyAuditMutationFromFunctionRoles
              Effect: Deny
              Principal: "*"
              Action:
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/aqp-audit-${StageName}"
              Condition:
                ArnLike:
                  aws:PrincipalArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-*FunctionRole-*"

  # ============================================================================
  # TELEMETRÍA: logs con retención de 14 días y CloudTrail definidos en el IaC
  # ============================================================================
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aqp-solidaria/${StageName}/functions"
      RetentionInDays: 14

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aqp-solidaria/${StageName}/api-access"
      RetentionInDays: 14

  CloudTrailLogBucket:
    Type: AWS::S3::Bucket
    Condition: CloudTrailEnabled
    Properties:
      BucketName: !Sub "aqp-solidaria-trail-${StageName}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTrailLogs
            Status: Enabled
            ExpirationInDays: 90

  CloudTrailLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CloudTrailEnabled
    Properties:
      Bucket: !Ref CloudTrailLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailLogBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/aqp-solidaria-${StageName}"
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${CloudTrailLogBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/aqp-solidaria-${StageName}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt CloudTrailLogBucket.Arn
              - !Sub "${CloudTrailLogBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  CloudTrail:
    Type: AWS::CloudTrail::Trail
    Condition: CloudTrailEnabled
    DependsOn: CloudTrailLogBucketPolicy
    Properties:
      TrailName: !Sub "aqp-solidaria-${StageName}"
      S3BucketName: !Ref CloudTrailLogBucket
      IsLogging: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: false
      EnableLogFileValidation: true

  # ============================================================================
  # DETECCIÓN OPCIONAL con pruebas de 30 días (apagadas por defecto, ver Parameters)
  # ============================================================================
  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Condition: GuardDutyEnabled
    Properties:
      Enable: true
      FindingPublishingFrequency: SIX_HOURS

  SecurityHubHub:
    Type: AWS::SecurityHub::Hub
    Condition: SecurityHubEnabled
    Properties:
      EnableDefaultStandards: false

  # ============================================================================
  # IDENTIDAD: Amazon Cognito User Pool + PKCE + TOTP MFA
  # ============================================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "aqp-solidaria-users-${StageName}"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      # Cognito applies MFA per pool, not per group, so every user (donors included) enrolls TOTP once.
      MfaConfiguration: "ON"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  CognitoGroupDonante:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: DONANTE
      UserPoolId: !Ref CognitoUserPool
      Description: Grupo para donantes autenticados

  CognitoGroupGestor:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: GESTOR
      UserPoolId: !Ref CognitoUserPool
      Description: Grupo para gestores de proyectos (el MFA TOTP es obligatorio para todo el pool)

  CognitoGroupAuditor:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: AUDITOR
      UserPoolId: !Ref CognitoUserPool
      Description: Grupo para auditores de seguridad (el MFA TOTP es obligatorio para todo el pool)

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CognitoUserPool
      # Hosted UI (classic): the branding below (CSS) applies only to it, and it is available in every Cognito feature
      # plan. The newer managed login (version 2) needs the Essentials or Plus plan, which is not the free plan.
      ManagedLoginVersion: 1

  # Brand of the Cognito hosted sign-in page (classic hosted UI), in the colours of the SPA. Cognito accepts only a
  # fixed list of class names and properties and rejects the rest at deploy time, which test/infra/hostedUi.test.ts
  # checks. CloudFormation cannot upload the logo (only the console or the API can), so the page has a coloured banner.
  CognitoHostedUiBranding:
    Type: AWS::Cognito::UserPoolUICustomizationAttachment
    DependsOn: CognitoUserPoolDomain
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientId: ALL
      CSS: |
        .background-customizable { background-color: #f8fafc; }
        .banner-customizable { background-color: #4f46e5; padding: 24px 0px 24px 0px; }
        .label-customizable { font-weight: 600; color: #334155; }
        .textDescription-customizable { color: #334155; font-size: 15px; padding-top: 10px; padding-bottom: 10px; display: block; }
        .inputField-customizable { width: 100%; height: 40px; color: #0f172a; background-color: #ffffff; border: 1px solid #cbd5e1; }
        .inputField-customizable:focus { border-color: #4f46e5; }
        .submitButton-customizable { font-size: 14px; font-weight: bold; margin: 20px 0px 10px 0px; height: 44px; width: 100%; color: #ffffff; background-color: #4f46e5; }
        .submitButton-customizable:hover { color: #ffffff; background-color: #4338ca; }
        .errorMessage-customizable { padding: 10px; font-size: 14px; width: 100%; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }

  CognitoResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: api
      Name: AQP Solidaria API Scopes
      UserPoolId: !Ref CognitoUserPool
      Scopes:
        - ScopeName: projects.write
          ScopeDescription: Permiso para crear y publicar proyectos
        - ScopeName: donations.write
          ScopeDescription: Permiso para registrar y simular donaciones
        - ScopeName: donations.read
          ScopeDescription: Permiso para consultar donaciones propias
        - ScopeName: audit.read
          ScopeDescription: Permiso para consultar registros de auditoría

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: CognitoResourceServer
    Properties:
      ClientName: !Sub "aqp-solidaria-spa-${StageName}"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - profile
        - email
        - api/projects.write
        - api/donations.write
        - api/donations.read
        - api/audit.read
      SupportedIdentityProviders:
        - COGNITO
      # The deployed SPA is served by CloudFront; localhost is only allowed in the academic stage.
      CallbackURLs: !If
        - IsAcademicStage
        - - !Sub "https://${CloudFrontDistribution.DomainName}/auth/callback"
          - http://localhost:3000/auth/callback
        - - !Sub "https://${CloudFrontDistribution.DomainName}/auth/callback"
      LogoutURLs: !If
        - IsAcademicStage
        - - !Sub "https://${CloudFrontDistribution.DomainName}"
          - http://localhost:3000
        - - !Sub "https://${CloudFrontDistribution.DomainName}"

  # ============================================================================
  # API GATEWAY: HTTP API con JWT Authorizer (PEP Zero Trust)
  # ============================================================================
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins: !If
          - IsAcademicStage
          - - !Sub "https://${CloudFrontDistribution.DomainName}"
            - http://localhost:3000
          - - !Sub "https://${CloudFrontDistribution.DomainName}"
        AllowHeaders:
          - Content-Type
          - Authorization
          - Idempotency-Key
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","sourceIp":"$context.identity.sourceIp","authorizerError":"$context.authorizer.error","integrationError":"$context.integrationErrorMessage","responseLatencyMs":"$context.responseLatency"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      RouteSettings:
        "GET /v1/projects":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
        "GET /v1/projects/{projectId}":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
        "GET /v1/projects/{projectId}/stats":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
              Audience:
                - !Ref CognitoUserPoolClient

  # ============================================================================
  # LAMBDA FUNCTIONS (Módulo Projects)
  # Cada función tiene su propio rol con solo las acciones de
  # specs/002-zta-hardening/contracts/iam-permissions-matrix.md
  # ============================================================================
  ListProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/
      Handler: projects/listProjects.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              # Query requires the table ARN (required resource type) and accepts the index ARN.
              Resource:
                - !GetAtt ProjectsTable.Arn
                - !Sub "${ProjectsTable.Arn}/index/status-createdAt-index"
      Events:
        PublicGet:
          Type: HttpApi
          Properties:
            Path: /v1/projects
            Method: GET
            ApiId: !Ref HttpApi
            Auth:
              Authorizer: NONE

  GetProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/
      Handler: projects/getProject.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ProjectsTable.Arn
      Events:
        PublicGet:
          Type: HttpApi
          Properties:
            Path: /v1/projects/{projectId}
            Method: GET
            ApiId: !Ref HttpApi
            Auth:
              Authorizer: NONE

  GetProjectStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/
      Handler: projects/getProjectStats.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ProjectsTable.Arn
      Events:
        PublicGet:
          Type: HttpApi
          Properties:
            Path: /v1/projects/{projectId}/stats
            Method: GET
            ApiId: !Ref HttpApi
            Auth:
              Authorizer: NONE

  CreateProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/
      Handler: projects/createProject.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource:
                - !GetAtt ProjectsTable.Arn
                - !GetAtt AuditTable.Arn
      Events:
        ProtectedPost:
          Type: HttpApi
          Properties:
            Path: /v1/projects
            Method: POST
            ApiId: !Ref HttpApi
            Auth:
              AuthorizationScopes:
                - api/projects.write

  PublishProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/
      Handler: projects/publishProject.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt ProjectsTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditTable.Arn
      Events:
        ProtectedPatch:
          Type: HttpApi
          Properties:
            Path: /v1/projects/{projectId}/publish
            Method: PATCH
            ApiId: !Ref HttpApi
            Auth:
              AuthorizationScopes:
                - api/projects.write

  # ============================================================================
  # LAMBDA FUNCTIONS (Módulo Donations & Idempotencia)
  # ============================================================================
  CreateDonationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/
      Handler: donations/createDonation.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ProjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource:
                - !GetAtt DonationsTable.Arn
                - !GetAtt IdempotencyTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditTable.Arn
      Events:
        ProtectedPost:
          Type: HttpApi
          Properties:
            Path: /v1/donations
            Method: POST
            ApiId: !Ref HttpApi
            Auth:
              AuthorizationScopes:
                - api/donations.write

  SimulateDonationFunction:
    Type: AWS::Serverless::Function
    Condition: IsAcademicStage
    Properties:
      CodeUri: ../backend/dist/
      Handler: donations/simulateDonation.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt ProjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt DonationsTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditTable.Arn
      Events:
        ProtectedPost:
          Type: HttpApi
          Properties:
            Path: /v1/donations/{donationId}/simulate
            Method: POST
            ApiId: !Ref HttpApi
            Auth:
              AuthorizationScopes:
                - api/donations.write

  GetMyDonationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/
      Handler: donations/getMyDonations.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:Query
              # Query requires the table ARN (required resource type) and accepts the index ARN.
              Resource:
                - !GetAtt DonationsTable.Arn
                - !Sub "${DonationsTable.Arn}/index/donorSub-createdAt-index"
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditTable.Arn
      Events:
        ProtectedGet:
          Type: HttpApi
          Properties:
            Path: /v1/donations/me
            Method: GET
            ApiId: !Ref HttpApi
            Auth:
              AuthorizationScopes:
                - api/donations.read

  # ============================================================================
  # LAMBDA FUNCTIONS (Módulo Auditoría)
  # ============================================================================
  GetAuditEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/dist/
      Handler: audit/getAuditEvents.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt AuditTable.Arn
      Events:
        ProtectedGet:
          Type: HttpApi
          Properties:
            Path: /v1/audit
            Method: GET
            ApiId: !Ref HttpApi
            Auth:
              AuthorizationScopes:
                - api/audit.read

  # ============================================================================
  # FRONTEND: S3 Privado + CloudFront OAC + Response Headers Policy (CSP / HSTS)
  # ============================================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "aqp-solidaria-spa-${StageName}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # The bucket is private: only this distribution may read it (origin access control), and only over TLS.
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub "${FrontendBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "aqp-oac-${StageName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "aqp-security-headers-${StageName}"
        SecurityHeadersConfig:
          # connect-src allows the API (execute-api) and the Cognito domain used by the sign-in code exchange.
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'self'; connect-src 'self' https://*.amazonaws.com https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none';"
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  UserPoolId:
    Description: ID del User Pool de Cognito
    Value: !Ref CognitoUserPool
  UserPoolClientId:
    Description: ID del cliente SPA de Cognito
    Value: !Ref CognitoUserPoolClient
  CognitoHostedUiUrl:
    Description: URL base del dominio de Cognito (Hosted UI y endpoints OAuth)
    Value: !Sub "https://${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  FrontendUrl:
    Description: URL del frontend servido por CloudFront
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
