services:
  floci:
    image: floci/floci:2.4.0
    environment:
      # Without this flag Floci accepts every request and the IAM evidence would prove nothing.
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"
      # The JWT authorizer of API Gateway refuses an issuer that is not https. With TLS on, Floci signs its tokens with
      # https://localhost:4566/<pool> and the authorizer trusts its own local CA when it reads the keys (JWKS).
      # The tests keep calling the emulator over plain http://localhost:4566, which stays available.
      FLOCI_TLS_ENABLED: "true"
      FLOCI_BASE_URL: https://localhost:4566
      # Lets the authorizer read the keys from an issuer on localhost.
      FLOCI_SECURITY_ALLOW_PRIVATE_JWT_TARGETS: "true"
      # Cognito does not accept access tokens that live less than 5 minutes; a test that needs an expired token
      # shortens the lifetime to a few seconds, which the emulator only allows with this setting off.
      FLOCI_SERVICES_COGNITO_ENFORCE_TOKEN_VALIDITY_LIMITS: "false"
    ports:
      - "4566:4566"
