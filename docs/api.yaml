openapi: 3.1.0
info:
  title: Plataforma de Donaciones Seguras - Fundación AQP-SOLIDARIA
  version: 2.0.0
  description: >
    API REST para la gestión de proyectos sociales e intenciones de donaciones simuladas
    bajo arquitectura Serverless y modelo de seguridad Zero Trust (NIST SP 800-207).
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/v1
    description: API Gateway HTTP API Stage
    variables:
      apiId:
        default: academic-api
      region:
        default: us-east-1

paths:
  /projects:
    get:
      summary: Listar proyectos publicados
      description: Retorna los proyectos PUBLICADOS y los CERRADOS (con lo recaudado). Los borradores son excluidos.
      operationId: listProjects
      responses:
        '200':
          description: Lista de proyectos publicados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Crear nuevo proyecto (solo GESTOR)
      description: Registra un proyecto en estado BORRADOR.
      operationId: createProject
      security:
        - CognitoJWT:
            - api/projects.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Proyecto creado exitosamente en BORRADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /projects/{projectId}:
    get:
      summary: Consultar detalle de proyecto
      description: Retorna información de un proyecto PUBLICADO o CERRADO. Si no existe o es BORRADOR, responde 404 para no filtrar existencia a visitantes.
      operationId: getProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle del proyecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/404NotFound'

  /projects/{projectId}/stats:
    get:
      summary: Consultar estadísticas agregadas públicas
      description: Retorna la meta y el monto acumulado de donaciones confirmadas en PEN.
      operationId: getProjectStats
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estadísticas agregadas del proyecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStats'
        '404':
          $ref: '#/components/responses/404NotFound'

  /projects/{projectId}/publish:
    patch:
      summary: Publicar proyecto (solo GESTOR)
      description: Transiciona el proyecto de BORRADOR a PUBLICADO.
      operationId: publishProject
      security:
        - CognitoJWT:
            - api/projects.write
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Proyecto publicado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Conflicto (proyecto ya publicado o estado inválido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}/close:
    patch:
      summary: Cerrar campaña (solo el GESTOR que creó el proyecto)
      description: >-
        Transiciona el proyecto de PUBLICADO a CERRADO. Una campaña cerrada deja de aceptar donaciones nuevas (409 en
        POST /donations) y sigue visible con lo recaudado; las donaciones ya registradas se pueden seguir confirmando.
        No se puede reabrir. Acción sensible: se revalida la sesión y el rol contra Cognito. Un GESTOR que no creó el
        proyecto recibe 403.
      operationId: closeProject
      security:
        - CognitoJWT:
            - api/projects.write
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Campaña cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: El proyecto no está PUBLICADO (borrador o ya cerrado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /donations:
    post:
      summary: Registrar intención de donación simulada (solo DONANTE)
      description: >-
        Registra una intención de donación en estado PENDIENTE_SIMULACION, o EN_REVISION si supera los controles de
        velocidad del donante en la hora. Requiere cabecera Idempotency-Key.
      operationId: createDonation
      security:
        - CognitoJWT:
            - api/donations.write
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador de idempotencia único por transacción
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDonationRequest'
      responses:
        '201':
          description: Intención de donación registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          description: Proyecto no encontrado
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Conflicto de idempotencia (clave reutilizada con payload distinto) o proyecto no PUBLICADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Límite de donaciones nuevas por donante y minuto alcanzado (TOO_MANY_REQUESTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno, por ejemplo una transacción cancelada por un motivo inesperado (no se registra nada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            Otras donaciones del mismo donante se procesan a la vez y se agotaron los reintentos (SERVICE_UNAVAILABLE).
            No se registró nada; puede repetirse con la misma Idempotency-Key tras el tiempo de Retry-After.
          headers:
            Retry-After:
              description: Segundos sugeridos antes de reintentar
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /donations/{donationId}/simulate:
    post:
      summary: Simular confirmación o rechazo (solo DONANTE propietario, stage académico)
      description: Permite confirmar o rechazar una donación propia. Solo desplegado en stage académico.
      operationId: simulateDonation
      security:
        - CognitoJWT:
            - api/donations.write
      parameters:
        - name: donationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateDonationRequest'
      responses:
        '200':
          description: Donación transicionada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Prohibido (intento de manipular donación ajena - BOLA)
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: Transición inválida, donación ya confirmada/rechazada o donación EN_REVISION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /donations/me:
    get:
      summary: Consultar historial propio (solo DONANTE)
      description: Retorna únicamente las donaciones asociadas al `sub` del usuario autenticado.
      operationId: getMyDonations
      security:
        - CognitoJWT:
            - api/donations.read
      responses:
        '200':
          description: Historial de donaciones del donante autenticado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Donation'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /reviews:
    get:
      summary: Cola de donaciones EN_REVISION (solo REVISOR)
      description: >
        Donaciones retenidas por los controles de velocidad, de la más antigua a la más reciente. Nunca incluye el
        `donorSub`: solo un seudónimo estable (`donorRef`). Nunca muestra al revisor sus propias donaciones, así que una
        página puede traer menos ítems que `limit` aunque haya `nextToken`. `nextToken` es opaco: se devuelve tal cual para pedir la
        página siguiente.
      operationId: listReviews
      security:
        - CognitoJWT:
            - api/donations.review
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: nextToken
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Una página de la cola de revisión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueuePage'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

  /donations/{donationId}/review:
    post:
      summary: Aprobar o rechazar una donación EN_REVISION (solo REVISOR)
      description: >
        `APROBAR` la deja en `PENDIENTE_SIMULACION` (el donante puede confirmarla); `RECHAZAR` la deja en
        `RECHAZADA_REVISION`, estado terminal que nunca suma al proyecto. Es una acción sensible: se revalidan la sesión
        y los grupos contra Cognito. La escritura solo se aplica si la donación sigue `EN_REVISION`.
      operationId: reviewDonation
      security:
        - CognitoJWT:
            - api/donations.review
      parameters:
        - name: donationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDonationRequest'
      responses:
        '200':
          description: Decisión registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDecisionResult'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          description: Sin token válido o sesión revocada
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Rol insuficiente, rol revocado, AUDITOR combinado o conflicto de interés (donación propia o de un proyecto que creó)
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: La donación ya no está EN_REVISION (otro revisor la resolvió o venció)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users:
    get:
      summary: Listar personas con sus roles (solo ADMIN)
      description: >
        Personas del pool con sus roles y, para cada una, qué roles se le pueden dar o quitar según las reglas
        (`addable`, `removable`). Nunca incluye el `sub`. Es una acción sensible: se revalidan la sesión y los grupos
        contra Cognito. `nextToken` es opaco.
      operationId: listUsers
      security:
        - CognitoJWT:
            - api/admin.users
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 20
        - name: email
          in: query
          required: false
          description: Inicio del correo (letras, dígitos y `. _ % + @ -`, hasta 64 caracteres).
          schema:
            type: string
        - name: nextToken
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Página de personas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersPage'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Rol insuficiente, rol ADMIN revocado o roles combinados
          $ref: '#/components/responses/403Forbidden'

  /admin/users/{userId}/roles:
    post:
      summary: Dar o quitar un rol a una persona (solo ADMIN)
      description: >
        Solo `DONANTE`, `GESTOR` y `REVISOR`; `AUDITOR` y `ADMIN` se asignan con el script de operación (403
        `ROLE_NOT_ASSIGNABLE`). No se puede cambiar la propia cuenta (403 `SELF_ROLE_CHANGE`) ni la de quien tiene
        `AUDITOR` o `ADMIN` (403 `PROTECTED_USER`). Una combinación que no puede existir (`GESTOR` con `REVISOR`) se rechaza
        con 409. Dar un rol que ya se tiene, o quitar uno que no se tiene, responde 200 con `changed: false`. Es una
        acción sensible y cada cambio se audita (`ROLE_GRANTED` / `ROLE_REVOKED`).
      operationId: changeUserRole
      security:
        - CognitoJWT:
            - api/admin.users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUserRoleRequest'
      responses:
        '200':
          description: Cambio aplicado (o ya estaba así)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeUserRoleResult'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          description: Rol insuficiente, rol revocado, rol no asignable desde la aplicación, cuenta propia o cuenta protegida
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          description: El resultado combinaría roles incompatibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /audit:
    get:
      summary: Consultar eventos de auditoría (solo AUDITOR)
      description: >
        Retorna registros de auditoría (éxitos de acciones que cambian estado y denegaciones de rutas protegidas),
        del más reciente al más antiguo. Sin parámetros devuelve hasta 50 eventos de los últimos 7 días.
        `eventType` filtra por tipo y `from`/`to` acotan el rango (máximo 7 días). Es una acción sensible: la sesión
        se revalida contra Cognito, y una sesión revocada responde 401.
      operationId: getAuditEvents
      security:
        - CognitoJWT:
            - api/audit.read
      parameters:
        - name: eventType
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Lista de eventos de auditoría
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'

components:
  securitySchemes:
    CognitoJWT:
      type: oauth2
      description: Autenticación mediante Cognito User Pool HTTP API JWT Authorizer
      flows:
        authorizationCode:
          authorizationUrl: https://{cognitoDomain}.auth.{region}.amazoncognito.com/oauth2/authorize
          tokenUrl: https://{cognitoDomain}.auth.{region}.amazoncognito.com/oauth2/token
          scopes:
            openid: Identificador de usuario OIDC
            profile: Perfil de usuario
            email: Correo electrónico
            api/projects.write: Permiso para gestionar proyectos
            api/donations.write: Permiso para registrar y simular donaciones
            api/donations.read: Permiso para consultar historial de donaciones propias
            api/audit.read: Permiso para consultar logs de auditoría
            api/donations.review: Permiso para revisar donaciones retenidas EN_REVISION
            api/admin.users: Permiso para administrar los roles de los usuarios

  responses:
    400BadRequest:
      description: Solicitud malformada o validación fallida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: Credencial ausente, inválida, expirada o ID token utilizado indebidamente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    403Forbidden:
      description: Rol insuficiente o intento de acceso a recurso ajeno
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: Recurso no encontrado o no publicado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Project:
      type: object
      required:
        - projectId
        - title
        - description
        - goalAmountCents
        - confirmedAmountCents
        - currency
        - status
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 10
          maxLength: 2000
        goalAmountCents:
          type: integer
          minimum: 1000
        confirmedAmountCents:
          type: integer
          minimum: 0
        currency:
          type: string
          enum: [PEN]
        status:
          type: string
          enum: [BORRADOR, PUBLICADO, CERRADO]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectStats:
      type: object
      required:
        - projectId
        - goalAmountCents
        - confirmedAmountCents
        - currency
        - progressPercentage
      properties:
        projectId:
          type: string
          format: uuid
        goalAmountCents:
          type: integer
        confirmedAmountCents:
          type: integer
        currency:
          type: string
          enum: [PEN]
        progressPercentage:
          type: number
          description: Porcentaje real confirmado sobre la meta; no se limita a 100 (una campaña puede superar su meta).
        status:
          type: string
          enum: [PUBLICADO, CERRADO]

    CreateProjectRequest:
      type: object
      required:
        - title
        - description
        - goalAmountCents
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
        description:
          type: string
          minLength: 10
          maxLength: 2000
        goalAmountCents:
          type: integer
          minimum: 1000

    Donation:
      type: object
      required:
        - donationId
        - projectId
        - donorSub
        - amountCents
        - currency
        - status
        - createdAt
        - updatedAt
      properties:
        donationId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        donorSub:
          type: string
        amountCents:
          type: integer
          minimum: 100
          maximum: 100000
        currency:
          type: string
          enum: [PEN]
        status:
          type: string
          enum: [PENDIENTE_SIMULACION, CONFIRMADA_SIMULADA, RECHAZADA_SIMULADA, EN_REVISION, RECHAZADA_REVISION]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDonationRequest:
      type: object
      required:
        - projectId
        - amountCents
      properties:
        projectId:
          type: string
          format: uuid
        amountCents:
          type: integer
          minimum: 100
          maximum: 100000

    SimulateDonationRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [CONFIRMAR, RECHAZAR]

    ReviewQueueItem:
      type: object
      required: [donationId, projectId, amountCents, createdAt, donorRef]
      properties:
        donationId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        amountCents:
          type: integer
        createdAt:
          type: string
          format: date-time
        reviewReasons:
          type: array
          items:
            type: string
            enum: [HOURLY_AMOUNT, STRUCTURING]
        donorRef:
          type: string
          description: Seudónimo estable del donante, propio de la cola (`don_…`, distinto del `actorRef` de la auditoría); nunca el `sub`.

    ReviewQueuePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'
        nextToken:
          type: string
          description: Opaco; ausente en la última página.

    ReviewDonationRequest:
      type: object
      required: [decision, motivo]
      properties:
        decision:
          type: string
          enum: [APROBAR, RECHAZAR]
        motivo:
          type: string
          minLength: 10
          maxLength: 500
          description: Obligatorio; se recortan los espacios antes de validar la longitud.

    ReviewDecisionResult:
      type: object
      required: [donationId, projectId, status, reviewDecision, reviewedAt]
      properties:
        donationId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDIENTE_SIMULACION, RECHAZADA_REVISION]
        reviewDecision:
          type: string
          enum: [APROBAR, RECHAZAR]
        reviewedAt:
          type: string
          format: date-time

    AdminUsersPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        nextToken:
          type: string
          description: Opaco; ausente en la última página.

    AdminUser:
      type: object
      required: [userId, roles, isSelf, isProtected, addable, removable]
      properties:
        userId:
          type: string
          description: Nombre del usuario en el pool, el que se usa en la ruta de cambio.
        email:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [DONANTE, GESTOR, REVISOR, AUDITOR, ADMIN]
        isSelf:
          type: boolean
        isProtected:
          type: boolean
          description: Tiene AUDITOR o ADMIN; solo el script de operación lo cambia.
        addable:
          type: array
          items:
            type: string
            enum: [DONANTE, GESTOR, REVISOR]
        removable:
          type: array
          items:
            type: string
            enum: [DONANTE, GESTOR, REVISOR]

    ChangeUserRoleRequest:
      type: object
      required: [action, role]
      properties:
        action:
          type: string
          enum: [ADD, REMOVE]
        role:
          type: string
          enum: [DONANTE, GESTOR, REVISOR, AUDITOR, ADMIN]
          description: Solo DONANTE, GESTOR y REVISOR se aceptan; los otros responden 403.

    ChangeUserRoleResult:
      type: object
      required: [userId, roles, changed]
      properties:
        userId:
          type: string
        roles:
          type: array
          items:
            type: string
        changed:
          type: boolean

    AuditEvent:
      type: object
      required:
        - eventId
        - timestamp
        - requestId
        - actorRef
        - resourceRef
        - action
        - outcome
      properties:
        eventId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
        actorRef:
          type: string
        resourceRef:
          type: string
        action:
          type: string
        outcome:
          type: string
          enum: [SUCCESS, DENIED, FAILED]
        eventType:
          type: string
          enum:
            - AUTHZ_DECISION
            - PROJECT_CREATED
            - PROJECT_PUBLISHED
            - DONATION_CREATED
            - DONATION_TRANSITIONED
            - ROLE_ASSIGNED
            - DONATION_RATE_LIMITED
            - SUSPICIOUS_VELOCITY
            - REVIEW_DECISION
            - REVIEW_EXPIRED
        reason:
          type: string
          description: >
            Motivo de una denegación o, en `REVIEW_DECISION`, la decisión (`APROBAR` o `RECHAZAR`); en
            `SUSPICIOUS_VELOCITY`, las reglas que la retuvieron.
        details:
          type: object
          description: Contexto numérico, sin datos personales (por ejemplo `expiryDays` en `REVIEW_EXPIRED`).
          additionalProperties:
            type: number

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
